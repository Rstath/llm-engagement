services:
  - type: web
    name: llm-engagement-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: RESEARCHER_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: LLM Engagement Study
      - key: SMALL_LLM_MODEL
        sync: false
      - key: MEDIUM_LLM_MODEL
        sync: false
