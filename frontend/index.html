<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="initialLoader" class="initial-loader" role="status" aria-live="polite" aria-label="Loading study">
    <div class="initial-loader__content">
      <div class="initial-loader__spinner" aria-hidden="true"></div>
      <p>Loading study…</p>
    </div>
  </div>
  <main class="app-shell">
    <header class="header">
      <img src="assets/logo.gif" alt="Study logo" class="logo" />
      <p id="participantLabel"></p>
    </header>
    <section id="app" class="card"></section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
